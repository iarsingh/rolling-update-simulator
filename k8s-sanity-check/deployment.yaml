apiVersion: v1
kind: Namespace
metadata:
  name: rollout-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-demo
  namespace: rollout-demo
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: rollout-demo
  template:
    metadata:
      labels:
        app: rollout-demo
        version: v1
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
